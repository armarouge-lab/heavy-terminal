# ==========================================
# CapBSD Heavy - Tmux Configuration
# ==========================================

# Cores do CapBSD (Barra levemente mais clara que o fundo)
set -g status-bg "#222222"
set -g status-fg "#E0E0E0"
set -g status-position bottom

# Adicionar o nome da sessão à esquerda com um destaque
set -g status-left "#[fg=#1A1A1A,bg=#E0E0E0,bold] TeufortBSD #[fg=#E0E0E0,bg=#222222,nobold] "
set -g status-left-length 20

# Adicionar um relógio à direita (HH:MM)
set -g status-right "#[fg=#E0E0E0,bg=#222222] %H:%M "
set -g status-right-length 20

# Como a janela atual vai aparecer (invertida para dar destaque)
set -g window-status-current-format "#[fg=#222222,bg=#E0E0E0,bold] #I:#W #[fg=#E0E0E0,bg=#222222,nobold]"
set -g window-status-format " #I:#W "

# Aumentar o histórico
set -g history-limit 10000

# Habilitar navegação com o mouse
set -g mouse on

# Atalhos estilo Vim para trocar de painéis
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Recarregar o arquivo de configuração com Prefixo + r
bind r source-file ~/.tmux.conf \; display-message "Configuração recarregada!"
